name: Build WDA v3.9.0 with Xcode 14 (Native for iOS 12)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    # Sử dụng macos-13 để chạy Xcode 14 tương thích tuyệt đối với iOS 12.5.6
    runs-on: macos-13

    steps:
      - name: 1. Tải mã nguồn WDA v3.9.0
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v3.9.0

      - name: 2. Thiết lập sử dụng Xcode 14.3.1
        run: |
          sudo xcode-select -s /Applications/Xcode_14.3.1.app/Contents/Developer
          xcodebuild -version

      - name: 3. Khởi tạo thư viện phụ thuộc (Carthage)
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            chmod +x ./Scripts/bootstrap.sh
            ./Scripts/bootstrap.sh -d || true
          fi

      - name: 4. Cấu hình Deployment Target xuống iOS 12.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' WebDriverAgent.xcodeproj/project.pbxproj

      - name: 5. Biên dịch WDA Runner chuẩn Native Xcode 14 (arm64)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="12.0" \
            PRODUCT_BUNDLE_IDENTIFIER="com.facebook.WebDriverAgentRunner" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

      - name: 6. Đóng gói file .IPA sạch cho iOS 12
        run: |
          APP_PATH="./build_output/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          
          # Dọn dẹp chữ ký cũ để chuẩn bị cài qua Sideloadly / tidevice
          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + || true
          rm -f "$APP_PATH/embedded.mobileprovision"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 WDA_v3.9.0_iOS12_Xcode14.ipa Payload

      - name: 7. Xuất file ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.9.0-ios12-xcode14
          name: "WDA v3.9.0 (Build bằng Xcode 14 chuẩn cho iOS 12)"
          files: WDA_v3.9.0_iOS12_Xcode14.ipa
