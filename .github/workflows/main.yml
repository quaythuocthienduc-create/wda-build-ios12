name: Build WDA v3.9.0 on macOS 13 (Xcode 14)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-13

    steps:
      - name: 1. Tải mã nguồn WDA v3.9.0
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v3.9.0

      - name: 2. Cố định sử dụng Xcode 14 (Tương thích iOS 12)
        run: |
          sudo xcode-select -s /Applications/Xcode_14.2.app/Contents/Developer || true
          xcodebuild -version

      - name: 3. Khởi tạo thư viện (Carthage)
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            chmod +x ./Scripts/bootstrap.sh
            ./Scripts/bootstrap.sh -d || true
          fi

      - name: 4. Cấu hình Xcode project về iOS 12.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' WebDriverAgent.xcodeproj/project.pbxproj
          
          python3 -c '
          with open("WebDriverAgent.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()
          lines = [line for line in content.splitlines() if "XCTAutomationSupport.framework in Frameworks" not in line]
          with open("WebDriverAgent.xcodeproj/project.pbxproj", "w") as f:
              f.write("\n".join(lines))
          '

      - name: 5. Biên dịch WDA Runner (arm64)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="12.0" \
            PRODUCT_BUNDLE_IDENTIFIER="com.facebook.WebDriverAgentRunner" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-Wno-everything" \
            OTHER_LDFLAGS="-ObjC -Wl,-undefined,dynamic_lookup"

      - name: 6. Đóng gói IPA sạch
        run: |
          APP_PATH="./build_output/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          
          # Dọn dẹp các file rác và chữ ký cũ
          rm -rf "$APP_PATH/Frameworks"
          rm -rf "$APP_PATH/PlugIns/WebDriverAgentRunner.xctest.dSYM"
          rm -f "$APP_PATH/embedded.mobileprovision"
          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + || true

          # Ép thông số MinimumOSVersion về chuẩn 12.0
          find "$APP_PATH" -name "Info.plist" -exec plutil -replace MinimumOSVersion -string "12.0" {} + || true

          # Đóng gói file .IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 WDA_v3.9.0_iOS12_Mac13.ipa Payload

      - name: 7. Xuất file ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.9.0-mac13
          name: "WDA v3.9.0 (Build trên macOS 13 - Xcode 14)"
          files: WDA_v3.9.0_iOS12_Mac13.ipa
