name: Build WDA v3.16.0 for iOS 12.5.6

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: 1. Tải mã nguồn WDA v3.16.0
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v3.16.0

      - name: 2. Khởi tạo thư viện phụ thuộc (Carthage)
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            chmod +x ./Scripts/bootstrap.sh
            ./Scripts/bootstrap.sh -d || true
          fi

      - name: 3. Chuyển XCTAutomationSupport sang Weak Link và hạ iOS 12.0
        run: |
          PBXPROJ="WebDriverAgent.xcodeproj/project.pbxproj"
          
          # Hạ Deployment Target xuống 12.0
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PBXPROJ"
          
          # Xóa dòng liên kết cứng XCTAutomationSupport trong phần Frameworks build phase
          # nhưng giữ nguyên đường dẫn tìm kiếm (Framework Search Paths)
          python3 -c '
          with open("WebDriverAgent.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()
          lines = [line for line in content.splitlines() if "XCTAutomationSupport.framework in Frameworks" not in line]
          with open("WebDriverAgent.xcodeproj/project.pbxproj", "w") as f:
              f.write("\n".join(lines))
          '

      - name: 4. Biên dịch WebDriverAgentRunner (arm64)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="12.0" \
            PRODUCT_BUNDLE_IDENTIFIER="com.facebook.WebDriverAgentRunner" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-Wno-everything" \
            OTHER_LDFLAGS="-ObjC -Wl,-undefined,dynamic_lookup" 2>&1 | tee build.log | grep -E "(error:|warning:|ld:|clang:|SUCCEEDED|FAILED)" || (tail -n 40 build.log && exit 1)

      - name: 5. Đóng gói file .IPA
        run: |
          mkdir -p Payload
          APP_PATH="./build_output/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          rm -rf "$APP_PATH/_CodeSignature"
          cp -r "$APP_PATH" Payload/
          zip -r -9 WDA_v3.16.0_iOS12_Unsigned.ipa Payload

      - name: 6. Lưu vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WDA-v3.16.0-iOS12-IPA
          path: WDA_v3.16.0_iOS12_Unsigned.ipa

      - name: 7. Tự động xuất file IPA ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.16.0-ios12
          name: "WebDriverAgent v3.16.0 cho iPhone 6 (iOS 12.5.6)"
          files: WDA_v3.16.0_iOS12_Unsigned.ipa
